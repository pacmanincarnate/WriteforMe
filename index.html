<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EllipsisProse 2.11 - AI Story Architect</title>

    <!-- Icons & Favicons -->
    <link rel="icon" type="image/jpeg" href="./ELPIcon2.jpg">
    <link rel="shortcut icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">

    <!-- Web App Manifest (PWA) -->
    <!-- Conditionally load manifest to prevent CORS errors when opening via file:// protocol -->
    <script>
        if (window.location.protocol !== 'file:') {
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = './manifest.webmanifest';
            document.head.appendChild(link);
        }
    </script>

    <!-- iOS / Safari Home Screen & Standalone App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EllipsisProse">
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
    <link rel="apple-touch-icon" href="./ELPIcon2.jpg">

    <!-- Mobile Browser Theme Color (Injected dynamically for full cross-browser compatibility) -->
    <script>
        (function () {
            try {
                var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var meta = document.createElement('meta');
                meta.name = 'theme-color';
                meta.content = isDark ? '#141416' : '#F7F5F0';
                document.head.appendChild(meta);
            } catch (e) { }
        })();
    </script>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="EllipsisProse">

    <!-- Temporary Phase 0-2 CDN shims (removed in Phase 3 when bundled/replaced) -->
    <script src="https://unpkg.com/lucide@1.33.0/dist/umd/lucide.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

    <!-- Google Fonts Preconnect & Critical Core Studio Typefaces -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
